{year:-1200,title:"Vedas: Indra y el sacrificio",loc:"Punjab (Sapta Sindhu)",lat:31,lon:75,civ:"india",capas:{

{year:-500,title:"Confucio y Lao Tzu",loc:"China",lat:34,lon:108,civ:"china",capas:{

// ---------- MATEMÁTICA lat/lon -> esfera ----------
var GLOBE_R=5;
function latLonToVector3(lat,lon,radius){
  var phi=(90-lat)*(Math.PI/180);
  var theta=(lon+180)*(Math.PI/180);
  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

// ---------- ESCENA THREE.JS ----------
var canvas=document.getElementById('globeCanvas');
var W=window.innerWidth,H=window.innerHeight;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,W/H,0.1,1000);
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(window.devicePixelRatio||1);
renderer.setSize(W,H);

scene.add(new THREE.AmbientLight(0x445566,1.1));
var sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(6,4,8);
scene.add(sun);
var sunDirection=sun.position.clone().normalize();

renderer.outputEncoding=THREE.sRGBEncoding;

var globeGroup=new THREE.Group();
scene.add(globeGroup);

// ---------- TIERRA FOTORREALISTA (texturas day/night/nubes, shader propio, sin WebGPU) ----------
// Mismas texturas que threejs.org/examples/webgpu_tsl_earth.html, consumidas con
// WebGLRenderer clásico vía ShaderMaterial (el "mesh" fotorrealista no depende de WebGPU/TSL).
var textureLoader=new THREE.TextureLoader();
textureLoader.crossOrigin='anonymous';
var earthDayMap=textureLoader.load('https://threejs.org/examples/textures/planets/earth_day_4096.jpg');
var earthNightMap=textureLoader.load('https://threejs.org/examples/textures/planets/earth_night_4096.jpg');
var earthBRCMap=textureLoader.load('https://threejs.org/examples/textures/planets/earth_bump_roughness_clouds_4096.jpg');
earthDayMap.encoding=THREE.sRGBEncoding;
earthNightMap.encoding=THREE.sRGBEncoding;

var earthMaterial=new THREE.ShaderMaterial({
  uniforms:{
    dayMap:{value:earthDayMap},
    nightMap:{value:earthNightMap},
    brcMap:{value:earthBRCMap},
    sunDirection:{value:sunDirection}
  },
  vertexShader:[
    'varying vec2 vUv;',
    'varying vec3 vWorldNormal;',
    'void main(){',
    '  vUv=uv;',
    '  vWorldNormal=normalize(mat3(modelMatrix)*normal);',
    '  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);',
    '}'
  ].join('\n'),
  fragmentShader:[
    'uniform sampler2D dayMap;',
    'uniform sampler2D nightMap;',
    'uniform sampler2D brcMap;',
    'uniform vec3 sunDirection;',
    'varying vec2 vUv;',
    'varying vec3 vWorldNormal;',
    'void main(){',
    '  vec3 n=normalize(vWorldNormal);',
    '  float ndotl=dot(n,normalize(sunDirection));',
    '  float dayMix=smoothstep(-0.2,0.2,ndotl);',
    '  vec3 dayColor=texture2D(dayMap,vUv).rgb;',
    '  vec3 nightColor=texture2D(nightMap,vUv).rgb*1.6;',
    '  float cloudAmt=texture2D(brcMap,vUv).b;',
    '  vec3 surface=mix(nightColor,dayColor,dayMix);',
    '  surface=mix(surface,vec3(1.0),cloudAmt*dayMix*0.9);',
    '  gl_FragColor=vec4(surface,1.0);',
    '}'
  ].join('\n')
});
var baseSphere=new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R,96,64),earthMaterial);
globeGroup.add(baseSphere);

// Atmósfera: glow tipo fresnel (real, dependiente del ángulo de vista y del sol),
// en vez de las dos esferas planas de color sólido que había antes.
var atmosphereMaterial=new THREE.ShaderMaterial({
  uniforms:{
    sunDirection:{value:sunDirection},
    uCameraPos:{value:new THREE.Vector3()}
  },
  transparent:true,
  blending:THREE.AdditiveBlending,
  depthWrite:false,
  side:THREE.BackSide,
  vertexShader:[
    'varying vec3 vNormalW;',
    'varying vec3 vWorldPos;',
    'void main(){',
    '  vNormalW=normalize(mat3(modelMatrix)*normal);',
    '  vec4 wp=modelMatrix*vec4(position,1.0);',
    '  vWorldPos=wp.xyz;',
    '  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);',
    '}'

});

// ---------- GOLFO PÉRSICO: retroceso costero animado (reconstrucción estilizada, no precisa) ----------
// El delta del Tigris-Éufrates avanzó hacia el sudeste durante milenios; Ur/Eridu eran
// casi costeras en el 3500-2000 a.C. y quedaron tierra adentro con el correr de los siglos.
// No hay coordenadas históricas exactas: esto interpola linealmente entre dos extremos
// aproximados a modo de ilustración del proceso, no como reconstrucción arqueológica precisa.
var PALEO_GULF_POINTS=[];
(function buildPaleoGulf(){
  var A={lat:31.0,lon:45.9}, B={lat:29.3,lon:48.6}; // NO (cerca de Ur) -> SE (hacia costa actual)
  var rows=10;
  for(var i=0;i<=rows;i++){
    var f=i/rows;
    var lat0=A.lat+(B.lat-A.lat)*f;
    var lon0=A.lon+(B.lon-A.lon)*f;
    var dryYear=-1000+f*2000; // cerca de Ur "se seca" primero; hacia el SE sigue siendo golfo hoy
    for(var j=-2;j<=2;j++){
      PALEO_GULF_POINTS.push({lat:lat0+j*0.28,lon:lon0+j*0.12,dryYear:dryYear});
    }
  }
})();
// Sprite circular suave (canvas radial-gradient) en vez del cuadrado por defecto de
// THREE.PointsMaterial, que de cerca se veía como bloques sólidos.
function makeDotSprite(color){
  var c=document.createElement('canvas');c.width=c.height=32;
  var ctx=c.getContext('2d');
  var g=ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(c);
}

var paleoGulfMat=new THREE.PointsMaterial({color:0x2a8fd8,size:0.05,map:makeDotSprite('rgba(255,255,255,1)'),transparent:true,opacity:0.85,sizeAttenuation:true,depthWrite:false});

var TERRITORIES={

  // "abrah" queda sin mancha propia: es una línea religiosa, no un territorio soberano —
  // su geografía ya está cubierta por la mancha de "levante".

var FADE_IN_Y=80,FADE_OUT_Y=500;
function buildCapGeometry(centerLat,centerLon,radiusDeg,radialSegments,ringSteps){
  var center=latLonToVector3(centerLat,centerLon,1);
  var up=Math.abs(center.y)<0.99?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  var east=new THREE.Vector3().crossVectors(up,center).normalize();
  var north=new THREE.Vector3().crossVectors(center,east).normalize();
  var positions=[];
  var maxAngle=THREE.MathUtils.degToRad(radiusDeg);
  var outR=GLOBE_R*1.006;
  positions.push(center.x*outR,center.y*outR,center.z*outR);
  for(var ring=1;ring<=ringSteps;ring++){
    var ang=maxAngle*(ring/ringSteps);
    for(var seg=0;seg<radialSegments;seg++){
      var theta=seg/radialSegments*Math.PI*2;
      var dir=new THREE.Vector3()
        .addScaledVector(center,Math.cos(ang))
        .addScaledVector(east,Math.sin(ang)*Math.cos(theta))
        .addScaledVector(north,Math.sin(ang)*Math.sin(theta))
        .normalize();
      positions.push(dir.x*outR,dir.y*outR,dir.z*outR);
    }
  }
  var indices=[];
  for(var seg=0;seg<radialSegments;seg++){
    indices.push(0,1+seg,1+((seg+1)%radialSegments));
  }
  for(var ring=1;ring<ringSteps;ring++){
    var base0=1+(ring-1)*radialSegments,base1=1+ring*radialSegments;
    for(var seg=0;seg<radialSegments;seg++){
      var a0=base0+seg,a1=base0+((seg+1)%radialSegments);
      var b0=base1+seg,b1=base1+((seg+1)%radialSegments);
      indices.push(a0,b0,b1);
      indices.push(a0,b1,a1);
    }
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geo.setIndex(indices);
  return geo;
}
function interpTerritory(frames,year){
  var first=frames[0],last=frames[frames.length-1];
  if(year<=first.year-FADE_IN_Y)return null;
  if(year>=last.year+FADE_OUT_Y)return null;
  var lat,lon,r,opacity;
  if(year<first.year){
    lat=first.lat;lon=first.lon;r=first.r;
    opacity=(year-(first.year-FADE_IN_Y))/FADE_IN_Y;
  }else if(year>=last.year){
    lat=last.lat;lon=last.lon;r=last.r;
    opacity=1-((year-last.year)/FADE_OUT_Y);
  }else{
    var a=frames[0],b=frames[frames.length-1];
    for(var i=0;i<frames.length-1;i++){
      if(year>=frames[i].year&&year<=frames[i+1].year){a=frames[i];b=frames[i+1];break;}
    }
    var t=(b.year===a.year)?0:(year-a.year)/(b.year-a.year);
    lat=a.lat+(b.lat-a.lat)*t;lon=a.lon+(b.lon-a.lon)*t;r=a.r+(b.r-a.r)*t;
    opacity=1;
  }
  return {lat:lat,lon:lon,r:r,opacity:THREE.MathUtils.clamp(opacity,0,1)};
}

// ---------- INTERACCIÓN: drag para rotar, wheel para zoom, click para foco ----------
var AUTO_ROTATE_SPEED=0.0009; // radianes por frame, rotación idle suave en vista global
var isDragging=false,lastX=0,lastY=0,movedDist=0;
var activePointers=new Map(); // pointerId -> {x,y}, para distinguir 1 dedo (rotar) de 2 dedos (pinch zoom)
var pinchStartDist=0;
function pointerDist(){
  var pts=Array.from(activePointers.values());
  var dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
  return Math.sqrt(dx*dx+dy*dy);
}
canvas.addEventListener('pointerdown',function(e){
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  tween=null;
  if(activePointers.size===1){
    isDragging=true;lastX=e.clientX;lastY=e.clientY;movedDist=0;
    canvas.classList.add('dragging');
  }else if(activePointers.size===2){
    isDragging=false; // dos dedos: pasa a modo pinch, no rotación
    pinchStartDist=pointerDist();
  }
});
window.addEventListener('pointermove',function(e){
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2){
    var d=pointerDist();
    var delta=pinchStartDist-d; // dedos se separan (zoom in) -> delta negativo -> acerca cámara
    distance=THREE.MathUtils.clamp(distance+delta*0.03,MIN_DIST,MAX_DIST);
    pinchStartDist=d;
    return;
  }
  if(!isDragging)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY;
  movedDist+=Math.abs(dx)+Math.abs(dy);
  var k=0.005;
  var euler=new THREE.Euler(dy*k,dx*k,0);
  var dq=new THREE.Quaternion().setFromEuler(euler);
  globeGroup.quaternion.premultiply(dq);
  lastX=e.clientX;lastY=e.clientY;
});
function endPointer(e){
  var wasSingleDrag=isDragging&&activePointers.size===1&&activePointers.has(e.pointerId);
  activePointers.delete(e.pointerId);
  if(wasSingleDrag&&movedDist<5){ // fue un click, no un drag
    doRaycast(e.clientX,e.clientY);
  }
  if(activePointers.size===0){
    isDragging=false;canvas.classList.remove('dragging');
  }else if(activePointers.size===1){
    var remaining=Array.from(activePointers.values())[0];
    isDragging=true;lastX=remaining.x;lastY=remaining.y;movedDist=0; // retoma rotación sin salto
  }
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  tween=null;
  distance=THREE.MathUtils.clamp(distance+e.deltaY*0.015,MIN_DIST,MAX_DIST);
},{passive:false});

var raycaster=new THREE.Raycaster();
var mouseNDC=new THREE.Vector2();
function doRaycast(clientX,clientY){
  var rect=canvas.getBoundingClientRect();
  mouseNDC.x=((clientX-rect.left)/rect.width)*2-1;
  mouseNDC.y=-((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  var hits=raycaster.intersectObjects(markerMeshes,false);
  if(hits.length){
    var ev=hits[0].object.userData.event;
    focusOnEvent3D(ev);
    setSliderToYear(ev.year);
  }
}

        related.map(function(r,i){return '<button class="holo-conn-item" data-i="'+EVENTS.indexOf(r)+'"><span class="holo-conn-name">'+r.title+'</span><span class="holo-conn-year">'+yearLabel(r.year)+'</span></button>';}).join('')+
      '</div>'):'')+
    '</div>'+
    '<div class="holo-footer">'+
      '<button class="holo-btn" id="prevEvt"'+(idx<=0?' disabled':'')+'>← Anterior</button>'+
      '<button class="holo-btn" id="nextEvt"'+(idx>=list.length-1?' disabled':'')+'>Siguiente →</button>'+
    '</div>';
  cardHost.appendChild(overlay);

  setTimeout(function(){
    var s=overlay.querySelector('#scanline');
    s.style.animation='scanDown 1.1s linear forwards';s.style.opacity='1';
  },450);

  overlay.querySelectorAll('.holo-layer-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      currentLayer=btn.dataset.layer;
      overlay.querySelectorAll('.holo-layer-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
      overlay.querySelector('#holoText').textContent=ev.capas[currentLayer];
    });
  });
  overlay.querySelector('#closeCard').addEventListener('click',unfocus3D);
  overlay.querySelectorAll('.holo-conn-item').forEach(function(btn){
    btn.addEventListener('click',function(){
      var target=EVENTS[parseInt(btn.dataset.i,10)];
      focusOnEvent3D(target);setSliderToYear(target.year);
    });
  });
  var prevBtn=overlay.querySelector('#prevEvt'),nextBtn=overlay.querySelector('#nextEvt');
  if(idx>0)prevBtn.addEventListener('click',function(){var t=list[idx-1];focusOnEvent3D(t);setSliderToYear(t.year);});
  if(idx<list.length-1)nextBtn.addEventListener('click',function(){var t=list[idx+1];focusOnEvent3D(t);setSliderToYear(t.year);});
}
function hideCard(){
  var o=cardHost.querySelector('.holo-overlay');
  if(!o)return;
  o.classList.add('closing');
  setTimeout(function(){o.remove();},CLOSE_MS);
}

function updateMarkerVisibility(year){
  EVENTS.forEach(function(ev){
    var show=activeFilters.has(ev.civ)&&Math.abs(ev.year-year)<400;
    ev._mesh.visible=show;
  });
}
function updateEventsList(year){
  eventsList.innerHTML='<h3>📌 EVENTOS DE ESTA ÉPOCA</h3>';
  var near=EVENTS.filter(function(e){return activeFilters.has(e.civ)&&Math.abs(e.year-year)<250;})
    .sort(function(a,b){return Math.abs(a.year-year)-Math.abs(b.year-year);});
  if(!near.length){eventsList.innerHTML+='<div style="color:#444;font-size:11px;padding:10px;">Sin eventos cercanos</div>';return;}
  near.forEach(function(ev){
    var card=document.createElement('div');
    card.className='event-card'+(ev.title===lastFocusTitle?' focused':'');
    card.style.borderLeftColor=hexColor(CIVS[ev.civ].color);
    card.innerHTML='<div class="ev-year">'+yearLabel(ev.year)+'</div><div class="ev-title">'+ev.title+'</div><div class="ev-civ">'+CIVS[ev.civ].n+'</div>';
    card.addEventListener('click',function(){focusOnEvent3D(ev);setSliderToYear(ev.year);});
    eventsList.appendChild(card);
  });
}

function updateCounter(val){
  var year=sliderToYear(val);
  var abs=Math.abs(Math.round(year));
  counterYear.textContent=year<0?abs+' a.C.':abs+' d.C.';
  counterEra.textContent=getEra(year);
  updateMarkerVisibility(year);
  updateEventsList(year);
  updatePaleoGulf(year);
  updateTerritories(year);
  var near=nearestEvent(year);
  if(near&&Math.abs(near.year-year)<=FOCUS_WINDOW){
    if(near.title!==lastFocusTitle)focusOnEvent3D(near);
  }else if(lastFocusTitle!==null){
    unfocus3D();
  }
}
function refresh(){updateCounter(parseFloat(yearSlider.value));}
function setSliderToYear(y){yearSlider.value=yearToSlider(y);updateCounter(parseFloat(yearSlider.value));}
yearSlider.addEventListener('input',function(e){updateCounter(parseFloat(e.target.value));});

// ---------- PLAY / RESET / VISTA GLOBAL ----------
var isPlaying=false,playInterval=null;
var playBtn=document.getElementById('playBtn');
playBtn.addEventListener('click',function(){
  if(isPlaying){clearInterval(playInterval);isPlaying=false;playBtn.textContent='▶ Play';}
  else{
    isPlaying=true;playBtn.textContent='⏸ Pausa';
    playInterval=setInterval(function(){
      var v=parseFloat(yearSlider.value)+0.12;
      if(v>=100)v=0;
      yearSlider.value=v;updateCounter(v);
    },120);
  }
});
document.getElementById('resetBtn').addEventListener('click',function(){
  if(isPlaying)playBtn.click();
  yearSlider.value=0;updateCounter(0);
});
document.getElementById('globalViewBtn').addEventListener('click',unfocus3D);
document.getElementById('sidebarToggle').addEventListener('click',function(){
  var sb=document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  document.getElementById('sidebarToggle').textContent=sb.classList.contains('collapsed')?'▶':'◀';
});
if(window.matchMedia('(max-width:700px)').matches){
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebarToggle').textContent='▶';
}

window.addEventListener('resize',function(){
  W=window.innerWidth;H=window.innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

// ---------- LOOP ----------
function animate(){
  requestAnimationFrame(animate);
  var t=Date.now()*0.002;
  markerMeshes.forEach(function(m,i){
    var ev=m.userData.event;
    if(ev._mesh.visible){ev._halo.scale.setScalar(1+0.35*Math.sin(t+i*0.7));}
  });
  if(tween){
    var now=performance.now();
    var f=Math.min(1,(now-tween.start)/tween.dur);
    var ef=easeInOutCubic(f);
    globeGroup.quaternion.copy(tween.fromQ).slerp(tween.toQ,ef);
    distance=tween.fromDist+(tween.toDist-tween.fromDist)*ef;
    if(f>=1)tween=null;
  }
  // Rotación idle suave: solo cuando no se está arrastrando ni hay un evento enfocado,
  // para no desviar la cámara de la tarjeta abierta.
  if(!isDragging&&!tween&&lastFocusTitle===null){
    globeGroup.rotateY(AUTO_ROTATE_SPEED);
  }
  camera.position.set(0,0,distance);
  camera.lookAt(0,0,0);
  atmosphereMaterial.uniforms.uCameraPos.value.copy(camera.position);
  renderer.render(scene,camera);
}
animate();
updateCounter(0);
})();
</script>
</body>
